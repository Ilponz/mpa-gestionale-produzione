<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#060709">
  <meta name="description" content="MPA di Maurizio Cavallaro - Sistema di Controllo e Gestione Produzione CAD/CAM Legno 4.0">
  
  <title>MPA di Maurizio Cavallaro</title>

  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts: Inter (UI 510 weight), Space Grotesk (Architectural Display), JetBrains Mono (Technical) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Atropos 3D Parallax Tilt CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/atropos@2.0.2/atropos.min.css">

  <!-- Stili Applicazione (B&W Architectural Liquid Glass Style) -->
  <link rel="stylesheet" href="css/style.css?v=8.0">
  <link rel="stylesheet" href="css/components.css?v=8.0">
</head>
<body>
  <!-- Contenitore Radice Applicazione -->
  <div id="app-root"></div>

  <!-- Librerie Esterne ad Alte Prestazioni (GSAP 3.12, Atropos 3D, Confetti, PDF.js, QRCode) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/atropos@2.0.2/atropos.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

  <!-- Script Applicativi (Cache Busted v8.0) -->
  <script src="js/mock-data.js?v=8.0"></script>
  <script src="js/storage.js?v=8.0"></script>
  <script src="js/auth.js?v=8.0"></script>
  <script src="js/app.js?v=8.0"></script>

  <!-- Registrazione PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=8.0')
          .then(reg => reg.update())
          .catch(err => console.warn('[PWA] SW warning:', err));
      });
    }
  </script>
</body>
</html>
